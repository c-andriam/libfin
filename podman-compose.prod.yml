# ============================================================================
#  Production stack.
# ============================================================================
#  Topologically identical to podman-compose.sim.yml. The differences are the
#  three that matter: a real acquirer, a real chain, and a Vault that does not
#  auto-unseal.
#
#  Network segmentation: only Nginx sits on frontend-net. The API port is never
#  published to the host — the only way in is through TLS on 443.
#
#  Usage:
#      make prod-preflight   # verify everything before anything starts
#      make prod             # build, migrate, start
#      make prod-down
#
#  Operational note: after any restart of gateway-vault, run
#  `make prod-vault-unseal`. A sealed Vault means the gateway cannot read the
#  hot wallet key, and payments will be refused rather than silently mis-served.
# ============================================================================

networks:
  # Nginx and the API. Not internal, so the API can reach the acquirer.
  #
  # Every network is named explicitly. Compose derives a default name from the
  # project directory, which made production reuse the networks the simulation
  # stack had already created — and podman adopts an existing network as-is
  # rather than reconciling its options, so `internal: true` below was silently
  # inert and the datastores had a route to the internet. A declared security
  # control that is quietly false is worse than none.
  frontend-net:
    name: gateway-prod-frontend

  # Datastores. `internal` means no route off the host: Postgres, Redis and
  # Vault cannot be reached from outside and — more to the point — cannot
  # reach out. Card data and the hot wallet key have nowhere to go.
  backend-net:
    name: gateway-prod-backend
    internal: true

  # Outbound path for the worker and the beat scheduler. They need the RPC
  # provider and the acquirer, and putting them on the internal network alone
  # left them with no route to either: every transfer would have failed and
  # every reversal with it, so every cardholder would have been charged with
  # no automatic refund. The datastores stay off this network.
  egress-net:
    name: gateway-prod-egress

volumes:
  pgdata_prod:
  redisdata_prod:
  vaultdata_prod:
  vaultlogs_prod:

services:
  # ── Data plane ────────────────────────────────────────────────────────────

  gateway-postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: gateway-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: gateway_db
      # scram-sha-256 rather than the md5 default.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    user: root
    # The certificate has to be owned by postgres and mode 600, which a
    # read-only bind mount cannot provide. Copy it into place, then hand over
    # to the image's own entrypoint, which drops privileges as usual.
    command:
      - sh
      - -c
      - |
        install -o postgres -g postgres -m 600 /certs/server.key /var/lib/postgresql/server.key
        install -o postgres -g postgres -m 644 /certs/server.crt /var/lib/postgresql/server.crt
        exec docker-entrypoint.sh postgres \
          -c ssl=on \
          -c ssl_cert_file=/var/lib/postgresql/server.crt \
          -c ssl_key_file=/var/lib/postgresql/server.key
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - ./nginx/ssl:/certs:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend-net
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  gateway-redis:
    image: docker.io/library/redis:7-alpine
    container_name: gateway-redis-prod
    restart: always
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      # Never evict. These keys hold nonces, STAN counters and the staged PANs
      # a reversal depends on; losing one costs a customer their refund.
      - --maxmemory-policy
      - noeviction
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-net
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  gateway-vault:
    image: docker.io/hashicorp/vault:1.19
    container_name: gateway-vault-prod
    restart: always
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
      # disable_mlock is a deliberate trade-off, not an oversight. With mlock
      # enabled Vault refuses to start unless it can lock memory, which a
      # rootless container cannot do — it exits with "Failed to lock memory"
      # and the gateway is left with no hot wallet key at all.
      #
      # Disabling it means Vault's memory may be swapped to disk. That is only
      # acceptable if the host has swap disabled or encrypted. Verify with
      # `swapon --show` (empty is what you want) before going live, or run the
      # stack rootful and set this back to false.
      VAULT_DISABLE_MLOCK: ${VAULT_DISABLE_MLOCK:-true}
      VAULT_LOCAL_CONFIG: >-
        {"storage": {"file": {"path": "/vault/file"}},
         "listener": [{"tcp": {"address": "0.0.0.0:8200", "tls_disable": 1}}],
         "default_lease_ttl": "168h", "max_lease_ttl": "720h",
         "disable_mlock": ${VAULT_DISABLE_MLOCK:-true}, "ui": false}
    command: ["server"]
    volumes:
      - vaultdata_prod:/vault/file
      - vaultlogs_prod:/vault/logs
    # A sealed Vault answers this endpoint with 501, which is the honest
    # signal: reachable but not usable until someone unseals it.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8200/v1/sys/health?standbyok=true || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - backend-net
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  # ── Application ───────────────────────────────────────────────────────────

  gateway-api:
    build:
      context: .
      containerfile: Containerfile.prod
    image: gateway:prod
    container_name: gateway-api-prod
    restart: always
    env_file:
      # Overridable so a rehearsal can point at its own file. Compose merges
      # env_file lists rather than replacing them, so an overlay cannot swap
      # this out — it has to be a variable. Production leaves it alone.
      - ${GATEWAY_ENV_FILE:-.env.prod}
    depends_on:
      gateway-postgres:
        condition: service_healthy
      gateway-redis:
        condition: service_healthy
    networks:
      # frontend-net first: with a container on two networks, DNS answers with
      # the first network's address, and Nginx must get the one it can route to.
      - frontend-net
      - backend-net
    command:
      - gunicorn
      - gateway.api:app
      - --worker-class=uvicorn.workers.UvicornWorker
      - --bind=0.0.0.0:8000
      - --workers=${WEB_CONCURRENCY:-4}
      - --timeout=60
      - --graceful-timeout=30
      - --access-logfile=-
      - --error-logfile=-
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "10"}

  gateway-worker:
    image: gateway:prod
    container_name: gateway-worker-prod
    restart: always
    env_file:
      # Overridable so a rehearsal can point at its own file. Compose merges
      # env_file lists rather than replacing them, so an overlay cannot swap
      # this out — it has to be a variable. Production leaves it alone.
      - ${GATEWAY_ENV_FILE:-.env.prod}
    depends_on:
      gateway-redis:
        condition: service_healthy
      gateway-postgres:
        condition: service_healthy
    networks:
      # egress-net for the RPC provider and the acquirer; backend-net for the
      # database and the broker.
      - egress-net
      - backend-net
    command:
      - celery
      - -A
      - gateway.worker.celery_app
      - worker
      - --loglevel=info
      - --concurrency=${CELERY_CONCURRENCY:-4}
    # Long grace period: a SIGKILL during a transfer strands a transaction
    # between "broadcast" and "recorded". Let the task finish.
    stop_grace_period: 120s
    healthcheck:
      # $HOSTNAME is unset in the container's non-interactive shell, so the
      # old `-d celery@$$HOSTNAME` asked for a node named "celery@" and every
      # worker reported unhealthy. `hostname` is what Celery actually uses.
      test: ["CMD-SHELL", "celery -A gateway.worker.celery_app inspect ping -d celery@$$(hostname) | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "10"}

  gateway-beat:
    image: gateway:prod
    container_name: gateway-beat-prod
    restart: always
    env_file:
      # Overridable so a rehearsal can point at its own file. Compose merges
      # env_file lists rather than replacing them, so an overlay cannot swap
      # this out — it has to be a variable. Production leaves it alone.
      - ${GATEWAY_ENV_FILE:-.env.prod}
    depends_on:
      gateway-redis:
        condition: service_healthy
    networks:
      # Reconciliation checks transactions against the chain, so beat needs
      # the same outbound path as the worker.
      - egress-net
      - backend-net
    command:
      - celery
      - -A
      - gateway.worker.celery_app
      - beat
      - --loglevel=info
      - --schedule=/tmp/celerybeat-schedule
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  # ── Edge ──────────────────────────────────────────────────────────────────

  gateway-nginx:
    image: docker.io/library/nginx:1.27-alpine
    container_name: gateway-nginx-prod
    restart: always
    # Rootless podman cannot bind below 1024: the container fails to start with
    # "cannot expose privileged port 80". Either raise the host's
    # net.ipv4.ip_unprivileged_port_start, run the stack rootful, or publish
    # high ports here and put the host's own proxy or a firewall redirect in
    # front. Defaults stay at the standard ports for a rootful deployment.
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro,z
      - ./nginx/ssl:/etc/nginx/ssl:ro,z
    # Substitute the container DNS server into the config, then start. The
    # nameserver address is assigned by the container runtime and is not known
    # until the container exists, so it cannot be baked into nginx.conf.
    command:
      - sh
      - -c
      - |
        RESOLVER=$$(awk '/^nameserver/ {print $$2; exit}' /etc/resolv.conf)
        RESOLVER=$${RESOLVER:-127.0.0.11}
        echo "nginx: resolving upstreams through $${RESOLVER}"
        sed "s/__RESOLVER__/$${RESOLVER}/" /etc/nginx/nginx.conf > /tmp/nginx.conf
        exec nginx -c /tmp/nginx.conf -g 'daemon off;'
    depends_on:
      gateway-api:
        condition: service_healthy
    networks:
      - frontend-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "https://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "10"}

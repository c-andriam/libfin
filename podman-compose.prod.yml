version: '3.8'

services:
  gateway-postgres:
    image: postgres:16-alpine
    container_name: gateway-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gateway_db
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-net

  gateway-redis:
    image: redis:7-alpine
    container_name: gateway-redis-prod
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-net

  gateway-vault:
    image: hashicorp/vault:1.19
    container_name: gateway-vault-prod
    restart: always
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_LOCAL_CONFIG: '{"storage": {"file": {"path": "/vault/file"}}, "listener": [{"tcp": { "address": "0.0.0.0:8200", "tls_disable": 1 }}], "ui": true}'
    volumes:
      - vaultdata_prod:/vault/file
    # Note: Port 8200 is not exposed to host for production, only available on backend-net
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - backend-net

  gateway-api:
    image: gateway:prod
    container_name: gateway-api-prod
    restart: always
    env_file:
      - .env.prod
    depends_on:
      gateway-postgres:
        condition: service_healthy
      gateway-redis:
        condition: service_healthy
    networks:
      - backend-net
      - frontend-net
    command: gunicorn gateway.api:app -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000

  gateway-worker:
    image: gateway:prod
    container_name: gateway-worker-prod
    restart: always
    env_file:
      - .env.prod
    depends_on:
      gateway-redis:
        condition: service_healthy
    networks:
      - backend-net
    command: celery -A gateway.worker.celery_app worker --loglevel=info -Q celery

  gateway-beat:
    image: gateway:prod
    container_name: gateway-beat-prod
    restart: always
    env_file:
      - .env.prod
    depends_on:
      gateway-redis:
        condition: service_healthy
    networks:
      - backend-net
    command: celery -A gateway.worker.celery_app beat --loglevel=info

  gateway-nginx:
    image: nginx:1.25-alpine
    container_name: gateway-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - gateway-api
    networks:
      - frontend-net

volumes:
  pgdata_prod:
  redisdata_prod:
  vaultdata_prod:

networks:
  frontend-net:
  backend-net:

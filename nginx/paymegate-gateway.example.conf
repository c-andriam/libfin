# ============================================================================
#  Nginx site for the libfin gateway in PayMeGate mode — Voie B (persistant).
#
#  Reverse proxy in front of the locally running gateway API (PayMeGate
#  hosted-checkout mode) on a VPS or 24/7 machine. Gives it a stable public
#  HTTPS endpoint for PayMeGate's webhook, with a real Let's Encrypt cert
#  issued by scripts/duckdns_cert.sh (DNS-01, no inbound port needed).
#
#  Copy to:      /etc/nginx/sites-available/<domain>
#  Symlink:      ln -s /etc/nginx/sites-available/<domain> /etc/nginx/sites-enabled/
#  Before use:   s/DOMAIN/<your duckdns or real domain>/g
#                s/UPSTREAM_PORT/8100/g  (the gateway's local listen port)
#
#  The gateway certificate is installed by duckdns_cert.sh at
#  nginx/ssl/server.{crt,key}. Mine copies them to /etc/nginx/ssl/.
#
#  Rate limiting and TLS style follow the repo's own nginx/nginx.conf so the
#  two share a house look, but this file is self-contained for a standalone
#  gateway host. It is intentionally a separate vhost from the payment-form
#  nginx.conf: that one serves the frontend, this one fronts only the API.
# ============================================================================

# ── HTTP: redirect to HTTPS; keep ACME reachable for renewal ─────────────────
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;   # duckdns_cert.sh uses DNS-01, so this is only a fallback
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                    # `listen ... http2` form is deprecated
    server_name DOMAIN;

    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers. `always` so they survive error responses too.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Card data and webhook bodies must never be cached between the edge and us.
    add_header Cache-Control "no-store" always;

    server_tokens off;

    # Payment and webhook bodies are small; nothing larger is legitimate.
    client_max_body_size 16k;
    client_body_timeout   10s;
    client_header_timeout 10s;

    # ── Rate limiting ───────────────────────────────────────────────────────
    limit_req_zone  $binary_remote_addr zone=gateway_api:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=gateway_conn:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # ── Upstream: the locally running gateway ────────────────────────────────
    # Use a variable so nginx resolves the host at request time (a literal
    # hostname would be cached at startup — see the note in nginx/nginx.conf).
    set $gateway "127.0.0.1:UPSTREAM_PORT";

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The gateway's own API-key middleware protects /pay etc.; /health and
    # /webhook/paymegate are in PUBLIC_PATHS so they need no key. Injecting one
    # here is harmless for the public routes and lets the browser talk to the
    # form's origin without holding a credential. Set rather than added.
    proxy_set_header X-API-Key "GATEWAY_API_KEY";

    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;
    # Never let nginx replay a payment or webhook against another backend.
    proxy_next_upstream off;

    # ── Routes ──────────────────────────────────────────────────────────────
    # Liveness, public. (Readiness is behind the key and left to the API.)
    location = /health {
        limit_req zone=gateway_api burst=20 nodelay;
        proxy_pass http://$gateway/health;
        access_log off;
    }

    # PayMeGate's order.paid webhook. Public by signature (HMAC verified in
    # the app); the API-key middleware is bypassed for this path, so PayMeGate
    # can POST here without our key — exactly as its dashboard is configured.
    location = /webhook/paymegate {
        limit_req zone=gateway_api burst=20 nodelay;
        limit_conn gateway_conn 20;
        proxy_pass http://$gateway/webhook/paymegate;
    }

    # The payment entry point (creates a hosted PayMeGate order) and the
    # transaction query. Protected by the injected API key.
    location ~ ^/(pay|transaction/[0-9]+)$ {
        limit_req  zone=gateway_api burst=20 nodelay;
        limit_conn gateway_conn 20;
        proxy_pass http://$gateway$request_uri;
    }

    # OpenAPI docs, useful to confirm the wiring — public only if you want it.
    location ~ ^/(docs|openapi.json)$ {
        limit_req zone=gateway_api burst=20 nodelay;
        proxy_pass http://$gateway$request_uri;
    }

    # Anything else is not a route this gateway exposes.
    location / {
        return 404;
    }
}

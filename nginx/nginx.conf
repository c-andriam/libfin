user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    # The gateway sits behind this proxy, so $remote_addr is the real client
    # only if nothing else fronts us. Log both so an operator can tell.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" xff="$http_x_forwarded_for" '
                      'rt=$request_time urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;          # do not advertise the nginx version

    # Payment payloads are small; anything larger is not a payment.
    client_max_body_size 16k;
    client_body_timeout  10s;
    client_header_timeout 10s;

    # ── Rate limiting ───────────────────────────────────────────────────────
    # A second line of defence: the application enforces its own per-key limit.
    # 429 rather than the default 503, which would be indistinguishable from
    # the circuit breaker's "we could not deliver" response.
    limit_req_zone  $binary_remote_addr zone=api_limit:10m rate=10r/s;
    # The form is nine files (one page, one stylesheet, seven scripts), so the
    # API's 10r/s would throttle an ordinary page load. Static assets get their
    # own, looser bucket rather than a shared one sized for the slower of the
    # two.
    limit_req_zone  $binary_remote_addr zone=static_limit:10m rate=60r/s;
    limit_conn_zone $binary_remote_addr zone=api_conn:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # Runtime DNS. Nginx resolves an `upstream` block's hostname once, at
    # startup, and caches it forever — so recreating the API container (any
    # deploy, restart or crash) leaves the proxy talking to a dead address and
    # serving 502 until someone restarts nginx by hand. Resolving through a
    # variable defers the lookup to request time and honours the TTL below.
    #
    # __RESOLVER__ is replaced at container start with the nameserver from
    # /etc/resolv.conf; see the gateway-nginx command in the compose files.
    resolver __RESOLVER__ valid=10s ipv6=off;
    resolver_timeout 5s;

    # ── HTTP: redirect, but leave the ACME path reachable ───────────────────
    server {
        listen 80;
        server_name _;

        # Certificate renewal must not be broken by the redirect.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS ───────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;                 # the `listen ... http2` form is deprecated
        server_name _;

        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;   # let modern clients pick
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security headers. `always` so they survive error responses too.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        # Both this header and each page's own <meta> policy apply, and the
        # browser enforces the intersection of the two — so `default-src 'none'`
        # alone would block the form's own stylesheet and scripts. This is that
        # meta policy, narrowed: `connect-src 'self'` rather than `*`, because
        # behind this proxy the page has exactly one origin to talk to.
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; form-action 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # Card data must never be cached anywhere on the way back.
        add_header Cache-Control "no-store" always;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The key that makes the browser's job trivial: it is added here, so
        # the page needs no configuration and never holds a credential. Set
        # rather than added, so a client's own X-API-Key is discarded.
        #
        # The placeholder below is substituted at container start from the
        # environment; see the gateway-nginx command in the compose files. It
        # is not named again in these comments, because the substitution is a
        # plain sed and would copy the key into them too. Left unsubstituted,
        # it reaches the API as a wrong key and comes back 401 — a loud
        # failure, not a silent bypass.
        proxy_set_header X-API-Key "__GATEWAY_API_KEY__";

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        # Longer than the acquirer timeout (BANK_TIMEOUT_SEC) so the API gets
        # to answer properly instead of the proxy cutting it off.
        proxy_read_timeout    30s;
        # A payment is not idempotent at the transport layer: never let nginx
        # replay it against another upstream.
        proxy_next_upstream off;

        # The payment form, served from the same origin as the API it calls.
        # One origin means no CORS, no API key in the browser, and no URL to
        # type: the page detects the relay and hides its connection panel.
        root /usr/share/nginx/html;
        charset utf-8;

        # ── The form ────────────────────────────────────────────────────────
        # Named one by one rather than served wholesale: the mounted directory
        # also holds README.md, CHECKLIST.md, ROADMAP.md and serve.py, and a
        # `try_files $uri` catch-all would hand every one of them out.

        location = / {
            limit_req zone=static_limit burst=100 nodelay;
            try_files /index.html =404;
        }

        location ~ ^/(index|payment|result|links)\.html$ {
            limit_req zone=static_limit burst=100 nodelay;
            try_files $uri =404;
        }

        location ^~ /assets/ {
            limit_req zone=static_limit burst=100 nodelay;
            try_files $uri =404;
        }

        # ── The API ─────────────────────────────────────────────────────────
        # Three routes, listed explicitly. The form calls no others, and an
        # allowlist keeps /health/ready — whose component names are a map of
        # the estate — off the public origin entirely.

        # A payment link: created by the merchant, read by whoever holds the
        # token. The token is the credential, so the read is deliberately not
        # behind anything else — but it discloses only the amount, never the
        # destination wallet, which is why exposing it here is safe.
        # Quoted: nginx reads an unquoted { } as block delimiters, so a regex
        # with a repetition count has to be a string or the config will not parse.
        # PayMeGate's callback. It carries no API key and cannot be given one —
        # PayMeGate signs each delivery with the shared webhook secret instead,
        # and the handler verifies that signature before touching any state. So
        # this block must NOT pass the server key down: doing so would tell the
        # API the caller is authenticated when nothing about the caller has been
        # established, and the signature check would become decorative.
        #
        # It is also the only channel by which a payment's outcome arrives. A
        # missing rule here does not degrade the integration; it silences it.
        location = /webhook/paymegate {
            limit_req  zone=api_limit burst=20 nodelay;
            limit_conn api_conn 20;
            proxy_set_header X-API-Key "";
            set $upstream_hook "gateway-api:8000";
            proxy_pass http://$upstream_hook;
        }

        # Merchants and liquidity providers. Configuration, not payment: the
        # caller's own key is forwarded rather than the server's, for the same
        # reason as the console below.
        location ~ "^/prestataires(/.*)?$" {
            limit_req  zone=api_limit burst=20 nodelay;
            limit_conn api_conn 20;
            proxy_set_header X-API-Key $http_x_api_key;
            set $upstream_presta "gateway-api:8000";
            proxy_pass http://$upstream_presta;
        }

        # The management console: list, enable/disable, delete. These disclose
        # destination wallets and can destroy links, so unlike every other
        # route here they must NOT inherit the server's key — otherwise the
        # proxy authenticates strangers, and anyone who can reach this origin
        # can empty the merchant's link list.
        #
        # The server-wide directive above sets the key unconditionally, which
        # is right for the payment routes and wrong for these. Overriding it
        # inside this block forwards the caller's own key instead: no key, no
        # access. Deleting the line would not do — the outer directive would
        # still apply.
        location ~ "^/links(/[0-9]+)?$" {
            limit_req  zone=api_limit burst=20 nodelay;
            limit_conn api_conn 20;
            proxy_set_header X-API-Key $http_x_api_key;
            set $upstream_links "gateway-api:8000";
            proxy_pass http://$upstream_links;
        }

        location ~ "^/link(/[A-Za-z0-9_-]{16,64})?$" {
            limit_req  zone=api_limit burst=20 nodelay;
            limit_conn api_conn 20;
            set $upstream_link "gateway-api:8000";
            proxy_pass http://$upstream_link;
        }

        location ~ ^/(pay|transaction/[0-9]+)$ {
            limit_req  zone=api_limit burst=20 nodelay;
            limit_conn api_conn 20;

            # A variable here is what forces the runtime lookup; a literal
            # hostname would be resolved once at startup and cached forever.
            set $upstream_api "gateway-api:8000";
            proxy_pass http://$upstream_api;
        }

        # Liveness only. The detailed readiness view lives behind the API key.
        location = /health {
            limit_req zone=api_limit burst=20 nodelay;
            set $upstream_health "gateway-api:8000";
            proxy_pass http://$upstream_health/health;
            access_log off;
        }

        # Anything else is neither a page of this form nor a route it calls.
        location / {
            return 404;
        }
    }
}

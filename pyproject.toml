[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "libfin"
version = "0.7.3"
description = "Python package for working with payment card systems"
readme = "README.rst"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13"
]
requires-python = ">=3.9"

[project.optional-dependencies]
docs = [
  "sphinx",
  "sphinx_rtd_theme",
  "cryptography >= 44"
]
test = [
  "flake8",
  "pytest",
  "bump2version",
  "coverage",
  "cryptography",
  "python-dateutil",
  "httpx",
  "pytest-asyncio",
  # The gateway tests run against an in-process Redis; lupa gives fakeredis the
  # Lua support the circuit breaker's atomic transitions need.
  "fakeredis",
  "lupa"
]
gateway = [
  "fastapi",
  "uvicorn",
  "gunicorn",
  "web3 >= 7",
  "pydantic >= 2",
  "sqlalchemy >= 2",
  "asyncpg",
  "psycopg2-binary",
  "aiosqlite",
  "alembic",
  "celery",
  "redis",
  "hvac",
  "slowapi",
  "httpx",
  # Encrypts the card number staged for a possible reversal.
  "cryptography >= 44"
]
crypto = [
  "cryptography >= 44"
]

[project.scripts]
mci_ipm_to_csv = "libfin.cli.mci_ipm_to_csv:cli_entry"
mci_csv_to_ipm = "libfin.cli.mci_csv_to_ipm:cli_entry"
mci_ipm_encode = "libfin.cli.mci_ipm_encode:cli_entry"
mci_ipm_param_encode = "libfin.cli.mci_ipm_param_encode:cli_entry"
mci_ipm_param_to_csv = "libfin.cli.mci_ipm_param_to_csv:cli_entry"
mideu = "libfin.cli.mideu:cli_entry"
paramconv = "libfin.cli.paramconv:cli_entry"

[tool.setuptools]
package-dir = {"" = "src"}
